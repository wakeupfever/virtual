<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巴中新环保系统 · 事件指挥</title>

<!-- ===== 依赖：顺序固定，版本必须与 packages/design-system/package.json 一致 ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.14.5/dist/index.css">
<link rel="stylesheet" href="../../packages/design-system/tokens.css">
<link rel="stylesheet" href="../../packages/design-system/skins/index.css">
<link rel="stylesheet" href="../../packages/design-system/layout.css">
<link rel="stylesheet" href="../../packages/design-system/base.css">
<link rel="stylesheet" href="../../packages/design-system/dist/ui.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.42/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.14.5/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.14.5/dist/locale/zh-cn.min.js"></script>
<script src="../../packages/design-system/dist/ui.iife.js"></script>
<script src="../../packages/design-system/dist/tokens.js"></script>
<!-- 原型禁止出现 <style> 与 style=""：所有外观来自第一、二层 -->
</head>
<body>

<!-- ===== ③ 模板：只能使用 whitelist.json 中的标签 + .l-* 布局类；自定义标签必须显式闭合 ===== -->
<div id="app">
  <ui-shell title="巴中新环保系统" :menu="DATA.menu" :active-key="state.route" v-model:collapsed="state.collapsed" @select="onSelect">
    <template #header-actions>
      <!-- 原型必备：三态切换（R-018）。转正式页面时删除 -->
      <span class="l-inline">
        <small>原型状态</small>
        <el-select v-model="state.view" size="small">
          <el-option label="ready" value="ready"></el-option>
          <el-option label="loading" value="loading"></el-option>
          <el-option label="empty" value="empty"></el-option>
          <el-option label="error" value="error"></el-option>
        </el-select>
        <el-select v-model="state.dataset" size="small">
          <el-option label="常规数据" value="normal"></el-option>
          <el-option label="长文本" value="long"></el-option>
          <el-option label="大数据量" value="big"></el-option>
        </el-select>
        <ui-tuner></ui-tuner>
      </span>
    </template>

    <!-- 事件列表（FR-INC-002）：菜单默认进入列表，不自动选中任何事件 -->
    <div v-if="state.route === 'incidents'" class="l-page l-page--fill">
      <div class="l-grid l-grid--cols-4">
        <ui-stat-card label="在办事件" :value="counts.active" hint="含已接报待定级"></ui-stat-card>
        <ui-stat-card label="已接报待定级" :value="counts.reported" hint="需 2 小时内定级"></ui-stat-card>
        <ui-stat-card label="未闭环调度单" :value="counts.dispatch" hint="存在即阻断事件终止"></ui-stat-card>
        <ui-stat-card label="待处理报告草稿" :value="counts.draft" hint="终止前必须清零"></ui-stat-card>
      </div>

      <section class="l-module l-stack l-stack--tight l-fill">
        <el-tabs class="is-tabbar" v-model="state.tab">
          <el-tab-pane v-for="t in DATA.tabs" :key="t.value" :name="t.value" :label="`${t.label} ${countOf(t.value)}`"></el-tab-pane>
        </el-tabs>

        <ui-filter-bar advanced searchable @search="reload" @reset="resetFilter">
          <span class="l-inline">
            <small>关键词</small>
            <el-input v-model="state.keyword" placeholder="事件编号 / 名称 / 企业" clearable></el-input>
          </span>
          <span class="l-inline">
            <small>来源</small>
            <el-select v-model="state.source" placeholder="全部" clearable>
              <el-option v-for="s in DATA.sources" :key="s.value" :label="s.label" :value="s.value"></el-option>
            </el-select>
          </span>
          <template #advanced>
            <span class="l-inline">
              <small>等级</small>
              <el-select v-model="state.level" placeholder="全部" clearable>
                <el-option v-for="l in DATA.levels" :key="l.value" :label="l.label" :value="l.value"></el-option>
              </el-select>
            </span>
            <span class="l-inline">
              <small>发现时间</small>
              <el-date-picker v-model="state.range" type="daterange" start-placeholder="开始" end-placeholder="结束"></el-date-picker>
            </span>
          </template>
          <template #actions>
            <el-button @click="notReady('导出事件台账')">导出</el-button>
            <el-button type="primary" @click="state.createOpen = true">人工建单</el-button>
          </template>
        </ui-filter-bar>

        <ui-state class="l-fill" :state="state.view" :empty-text="`${labelOf(DATA.tabs, state.tab)}下暂无事件`" @retry="reload">
          <el-table class="l-fill" :data="pagedRows">
            <el-table-column prop="no" label="事件编号" width="170"></el-table-column>
            <el-table-column prop="name" label="事件名称" min-width="200" show-overflow-tooltip></el-table-column>
            <el-table-column label="来源 / 原始单据" min-width="190" show-overflow-tooltip>
              <template #default="{ row }">
                <span class="l-inline">
                  <span>{{ labelOf(DATA.sources, row.source) }}</span>
                  <small>{{ row.originNo }} · v{{ row.originVer }}</small>
                </span>
              </template>
            </el-table-column>
            <el-table-column prop="enterprise" label="企业 / 位置" min-width="180" show-overflow-tooltip></el-table-column>
            <el-table-column label="状态 / 等级" width="150">
              <template #default="{ row }">
                <span class="l-inline">
                  <el-tag size="small" :type="statusType(row.status)">{{ labelOf(DATA.tabs, row.status) }}</el-tag>
                  <small>{{ row.level ? labelOf(DATA.levels, row.level) : '未定级' }}</small>
                </span>
              </template>
            </el-table-column>
            <el-table-column label="接报人 / 接报时间" min-width="170">
              <template #default="{ row }">
                <span class="l-inline">
                  <span>{{ row.receiver }}</span>
                  <small>{{ row.receivedAt }}</small>
                </span>
              </template>
            </el-table-column>
            <el-table-column label="关联" width="150">
              <template #default="{ row }">
                <small>上报 {{ row.rel.reports }} · 告警 {{ row.rel.alarms }} · 调度 {{ row.rel.dispatch }}</small>
              </template>
            </el-table-column>
            <!-- 行内动作最多两个（CLAUDE.md §2）：其余动作放进作战面板 -->
            <el-table-column label="操作" width="150" fixed="right" class-name="is-actions">
              <template #default="{ row }">
                <el-button link type="primary" size="small" @click="enterCommand(row)">进入指挥</el-button>
                <el-button link type="primary" size="small" @click="openSource(row)">来源</el-button>
              </template>
            </el-table-column>
          </el-table>
          <div class="l-cluster l-cluster--end">
            <el-pagination layout="total, prev, pager, next, sizes" :total="filteredRows.length" v-model:current-page="state.page" v-model:page-size="state.pageSize" :page-sizes="[10, 20, 50]"></el-pagination>
          </div>
        </ui-state>
      </section>
    </div>

    <!-- 未覆盖的菜单：明确占位并写清对应 PRD 章节（R-053） -->
    <div v-else class="l-page l-page--fill">
      <section class="l-module l-fill">
        <ui-state class="l-fill" state="empty" :empty-text="`「${currentMenu.label}」原型尚未覆盖`">
          <template #action>
            <div class="l-stack l-stack--tight">
              <small>对应 PRD {{ currentMenu.prd }}。本轮覆盖的菜单：事件指挥 → 事件列表。</small>
              <span class="l-cluster l-cluster--center">
                <el-button type="primary" @click="onSelect('incidents')">前往事件列表</el-button>
              </span>
            </div>
          </template>
        </ui-state>
      </section>
    </div>

    <!-- 作战面板（FR-INC-002）：只能由列表点击进入，顶部固定显示"当前作战事件（已明确选择）" -->
    <el-drawer v-model="state.commandOpen" size="620px" :title="state.current ? `作战面板 ${state.current.no}` : '作战面板'">
      <div v-if="state.current" class="l-stack">
        <section class="l-module">
          <ui-module-header title="当前作战事件（已明确选择）" :desc="state.current.name">
            <template #meta>{{ labelOf(DATA.tabs, state.current.status) }}</template>
          </ui-module-header>
          <div class="l-grid l-grid--cols-2 l-grid--tight">
            <div v-for="f in commandFields" :key="f.label" class="l-tile">
              <small>{{ f.label }}</small>
              <strong>{{ f.value }}</strong>
            </div>
          </div>
        </section>

        <section class="l-module">
          <ui-module-header title="处置时间轴" desc="每一步留痕，绑定当前事件">
            <template #meta>{{ state.current.timeline.length }} 条</template>
          </ui-module-header>
          <div class="l-stack l-stack--tight">
            <ui-list-item v-for="(t, i) in state.current.timeline" :key="i" :title="t.action" :subtitle="`${t.at} · ${t.by}`" divided>
              <template #trailing><small>{{ t.note }}</small></template>
            </ui-list-item>
          </div>
        </section>

        <section class="l-module">
          <ui-module-header title="通知回执" desc="每个「收件人 × 通道」独立记录，未接入通道显示 CHANNEL_OFF">
            <template #meta>{{ state.current.notices.length }} 条</template>
          </ui-module-header>
          <div class="l-stack l-stack--tight">
            <ui-list-item v-for="(n, i) in state.current.notices" :key="i" :title="`${n.to} · ${n.channel}`" :subtitle="n.at" divided>
              <template #trailing>
                <el-tag size="small" :type="n.state === 'CHANNEL_OFF' ? 'info' : (n.state === '已确认' ? 'success' : 'warning')">{{ n.state }}</el-tag>
              </template>
            </ui-list-item>
          </div>
        </section>
      </div>
      <template #footer>
        <div class="l-cluster l-cluster--end">
          <el-button @click="state.commandOpen = false">返回事件列表</el-button>
          <el-button type="primary" @click="terminate">终止校验</el-button>
        </div>
      </template>
    </el-drawer>

    <!-- 人工建单（FR-INC-001）：来源快照字段 -->
    <el-dialog v-model="state.createOpen" title="人工建单" width="520px">
      <el-form class="l-form" label-position="right">
        <el-form-item label="事件名称"><el-input v-model="state.form.name" placeholder="简述事件"></el-input></el-form-item>
        <el-form-item label="来源类型">
          <el-select v-model="state.form.source" placeholder="请选择">
            <el-option v-for="s in DATA.sources" :key="s.value" :label="s.label" :value="s.value"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="企业 / 位置"><el-input v-model="state.form.enterprise" placeholder="企业名称 + 具体位置"></el-input></el-form-item>
        <el-form-item label="接报依据"><el-input v-model="state.form.basis" type="textarea" placeholder="核对过的告警 / 上报 / 监测 / 视频证据"></el-input></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="state.createOpen = false">取消</el-button>
        <el-button type="primary" :disabled="!createValid" @click="submitCreate">建单</el-button>
      </template>
    </el-dialog>
  </ui-shell>
</div>

/* ===== ② state：状态只放这里。转正式页面时映射为 composables/useIncidents.ts =====
 * route：hash 路由 #/<key>，与 UiShell 菜单 key 一致（R-038 / R-053） */
const routeFromHash = () => location.hash.replace(/^#\/?/, '').split(/[?/]/)[0] || 'incidents'
const state = Vue.reactive({
  route: routeFromHash(),
  collapsed: false,
  view: 'ready',        // ready | loading | empty | error（R-018 三态）
  dataset: 'normal',    // normal | long | big
  tab: 'all',
  keyword: '',
  source: '',
  level: '',
  range: null,
  page: 1,
  pageSize: 10,
  current: null,        // FR-INC-002：不自动选中第一条，只有点「进入指挥」才有值
  commandOpen: false,
  createOpen: false,
  form: { name: '', source: '', enterprise: '', basis: '' },
})

/* ===== ④ methods：只读 DATA、改 state；禁止直接操作 DOM 样式 ===== */
const app = Vue.createApp({
  setup() {
    const labelOf = (list, v) => (list.find(x => x.value === v) || {}).label || v
    const findMenu = (list, key) => {
      for (const item of list) {
        if (item.key === key) return item
        const hit = item.children && findMenu(item.children, key)
        if (hit) return hit
      }
      return null
    }
    const currentMenu = Vue.computed(() => findMenu(DATA.menu, state.route) || { label: state.route, prd: '—' })

    const rows = Vue.computed(() => (state.view === 'empty' ? [] : DATA.incidents[state.dataset]))
    const filteredRows = Vue.computed(() =>
      rows.value.filter(r =>
        (state.tab === 'all' || r.status === state.tab) &&
        (!state.keyword || r.no.includes(state.keyword) || r.name.includes(state.keyword) || r.enterprise.includes(state.keyword)) &&
        (!state.source || r.source === state.source) &&
        (!state.level || r.level === state.level)))
    const pagedRows = Vue.computed(() => {
      const start = (state.page - 1) * state.pageSize
      return filteredRows.value.slice(start, start + state.pageSize)
    })
    const countOf = tab => (tab === 'all' ? rows.value.length : rows.value.filter(r => r.status === tab).length)
    const counts = Vue.computed(() => ({
      active: rows.value.filter(r => r.status === 'active').length,
      reported: rows.value.filter(r => r.status === 'reported').length,
      dispatch: rows.value.reduce((n, r) => n + r.dispatchOpen, 0),
      draft: rows.value.filter(r => r.status !== 'archived').length,
    }))
    Vue.watch(() => [state.tab, state.keyword, state.source, state.level, state.dataset], () => { state.page = 1 })

    const statusType = v => ({ active: 'danger', reported: 'warning', archived: 'info' })[v] || 'info'
    const commandFields = Vue.computed(() => {
      const c = state.current
      if (!c) return []
      return [
        { label: '来源 / 原始单据', value: `${labelOf(DATA.sources, c.source)} · ${c.originNo} v${c.originVer}` },
        { label: '接报人 / 接报时间', value: `${c.receiver} · ${c.receivedAt}` },
        { label: '企业 / 位置', value: c.enterprise },
        { label: '状态 / 等级', value: `${labelOf(DATA.tabs, c.status)} · ${c.level ? labelOf(DATA.levels, c.level) : '未定级'}` },
        { label: '总指挥 / 当前响应', value: `${c.commander} · ${c.response}` },
        { label: '关键风险', value: c.risk },
        { label: '关联数据', value: `上报 ${c.rel.reports} · 告警 ${c.rel.alarms} · 调度 ${c.rel.dispatch}` },
        { label: '下一步动作', value: c.next },
      ]
    })

    const onSelect = key => { location.hash = `#/${key}` }
    window.addEventListener('hashchange', () => { state.route = routeFromHash() })
    if (!location.hash) history.replaceState(null, '', `#/${state.route}`)

    const resetFilter = () => { state.keyword = ''; state.source = ''; state.level = ''; state.range = null }
    const reload = () => { state.view = 'loading'; setTimeout(() => { state.view = 'ready' }, 600) }
    const notReady = what => ElementPlus.ElMessage.info(`${what}：原型未覆盖`)
    // FR-INC-002：只有用户明确点击才载入作战面板
    const enterCommand = row => { state.current = row; state.commandOpen = true }
    const openSource = row => ElementPlus.ElMessage.info(`来源快照 ${row.originNo} v${row.originVer}（只读，不被后续修改覆盖）`)
    // FR-INC-005：存在未闭环调度单时，终止校验不通过
    const terminate = () => {
      const c = state.current
      if (c.dispatchOpen > 0) {
        ElementPlus.ElMessage.error(`终止校验未通过：还有 ${c.dispatchOpen} 张未闭环调度单`)
        return
      }
      ElementPlus.ElMessage.success('终止校验通过（mock）')
    }
    const createValid = Vue.computed(() => !!(state.form.name && state.form.source && state.form.enterprise && state.form.basis))
    const submitCreate = () => { state.createOpen = false; ElementPlus.ElMessage.success('已建单（mock）：来源快照与接报依据已记录') }

    return {
      DATA, state, currentMenu, rows, filteredRows, pagedRows, counts, countOf, labelOf, statusType, commandFields,
      onSelect, resetFilter, reload, notReady, enterCommand, openSource, terminate, createValid, submitCreate,
    }
  },
})
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn }).use(DesignSystemUI).mount('#app')
</script>
</body>
</html>
