<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型模板 · 请改成功能名</title>

<!-- ===== 依赖：顺序固定，版本必须与 packages/design-system/package.json 一致 ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.14.5/dist/index.css">
<link rel="stylesheet" href="../../packages/design-system/tokens.css">
<link rel="stylesheet" href="../../packages/design-system/skins/index.css">
<link rel="stylesheet" href="../../packages/design-system/layout.css">
<link rel="stylesheet" href="../../packages/design-system/base.css">
<link rel="stylesheet" href="../../packages/design-system/dist/ui.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.42/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.14.5/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.14.5/dist/locale/zh-cn.min.js"></script>
<script src="../../packages/design-system/dist/ui.iife.js"></script>
<script src="../../packages/design-system/dist/tokens.js"></script>
<!-- 原型禁止出现 <style> 与 style=""：所有外观来自第一、二层 -->
</head>
<body>

<!-- ===== ③ 模板：只能使用 whitelist.json 中的标签 + .l-* 布局类；自定义标签必须显式闭合，不能自闭合 ===== -->
<div id="app">
  <ui-shell title="示例系统" :menu="DATA.menu" :active-key="state.route" v-model:collapsed="state.collapsed" @select="onSelect">
    <template #header-actions>
      <!-- 原型必备：三态切换（R-018）。转正式页面时删除 -->
      <span class="l-inline">
        <small>原型状态</small>
        <el-select v-model="state.view" size="small">
          <el-option label="ready" value="ready"></el-option>
          <el-option label="loading" value="loading"></el-option>
          <el-option label="empty" value="empty"></el-option>
          <el-option label="error" value="error"></el-option>
        </el-select>
        <el-select v-model="state.dataset" size="small">
          <el-option label="常规数据" value="normal"></el-option>
          <el-option label="长文本" value="long"></el-option>
          <el-option label="大数据量" value="big"></el-option>
        </el-select>
        <ui-tuner></ui-tuner>
      </span>
    </template>

    <div class="l-page l-page--fill">
      <ui-page-header title="订单列表" :subtitle="`共 ${rows.length} 条`">
        <template #actions>
          <el-button @click="reload">刷新</el-button>
          <el-button type="primary" @click="state.dialogOpen = true">新建订单</el-button>
        </template>
      </ui-page-header>

      <section class="l-module l-fill">
        <div class="l-toolbar">
          <span class="l-cluster">
            <el-input v-model="state.keyword" placeholder="搜索客户 / 单号" clearable></el-input>
            <el-select v-model="state.status" placeholder="状态" clearable>
              <el-option v-for="s in DATA.statuses" :key="s.value" :label="s.label" :value="s.value"></el-option>
            </el-select>
          </span>
          <span class="l-cluster l-cluster--end">
            <el-button @click="resetFilter">重置</el-button>
          </span>
        </div>

        <ui-state class="l-fill" :state="state.view" @retry="reload">
          <el-table class="l-fill" :data="pagedRows" stripe>
            <el-table-column prop="no" label="单号" width="160"></el-table-column>
            <el-table-column prop="customer" label="客户" min-width="160" show-overflow-tooltip></el-table-column>
            <el-table-column prop="amount" label="金额" width="120" align="right"></el-table-column>
            <el-table-column label="状态" width="100">
              <template #default="{ row }">
                <el-tag :type="statusType(row.status)" size="small">{{ statusLabel(row.status) }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="remark" label="备注" min-width="240" show-overflow-tooltip></el-table-column>
            <el-table-column label="操作" width="140" fixed="right">
              <template #default="{ row }">
                <el-button text type="primary" size="small" @click="view(row)">查看</el-button>
                <el-button text type="danger" size="small" @click="remove(row)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <div class="l-cluster l-cluster--end">
            <el-pagination layout="total, prev, pager, next, sizes" :total="filteredRows.length" v-model:current-page="state.page" v-model:page-size="state.pageSize" :page-sizes="[10, 20, 50]"></el-pagination>
          </div>
        </ui-state>
      </section>
    </div>

    <el-dialog v-model="state.dialogOpen" title="新建订单">
      <el-form class="l-form" label-position="right">
        <el-form-item label="客户"><el-input v-model="state.form.customer"></el-input></el-form-item>
        <el-form-item label="金额"><el-input-number v-model="state.form.amount" :min="0"></el-input-number></el-form-item>
        <el-form-item label="备注"><el-input v-model="state.form.remark" type="textarea"></el-input></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="state.dialogOpen = false">取消</el-button>
        <el-button type="primary" @click="submit">确定</el-button>
      </template>
    </el-dialog>
  </ui-shell>
</div>

<script>
/* ===== ① DATA：mock 数据只放这里。转正式页面时整块替换为 features/<模块>/api.ts =====
 * 必须包含：常规样本、长文本样本、大数据量样本（R-018） */
const DATA = {
  menu: [
    { key: 'orders', label: '订单管理' },
    { key: 'customers', label: '客户管理' },
    { key: 'reports', label: '报表' },
  ],
  statuses: [
    { value: 'pending', label: '待处理' },
    { value: 'done', label: '已完成' },
    { value: 'cancelled', label: '已取消' },
  ],
  orders: {
    normal: [
      { no: 'SO-20260901-001', customer: '成都示例科技', amount: 12800, status: 'pending', remark: '常规订单' },
      { no: 'SO-20260901-002', customer: '绵阳示例贸易', amount: 3200, status: 'done', remark: '' },
      { no: 'SO-20260901-003', customer: '德阳示例机械', amount: 56000, status: 'cancelled', remark: '客户取消' },
    ],
    long: [
      { no: 'SO-20260901-004', customer: '四川省某某某某某某某某某某某某某某某某某某某某科技发展有限责任公司西南区域分公司', amount: 99999999, status: 'pending', remark: '这是一条非常长的备注，用于验证表格在超长文本下的换行、截断与省略行为是否符合预期，转正式页面时应保留该样本以便视觉回归对比。' },
    ],
    big: Array.from({ length: 500 }, (_, i) => ({
      no: `SO-20260901-${String(i + 10).padStart(3, '0')}`,
      customer: `批量客户 ${i + 1}`,
      amount: (i * 37) % 10000,
      status: ['pending', 'done', 'cancelled'][i % 3],
      remark: i % 7 === 0 ? '每七条一条备注' : '',
    })),
  },
}

/* ===== ② state：状态只放这里。转正式页面时映射为 composables/useXxx.ts =====
 * route：原型用 hash 路由 #/<key>（与 UiShell 菜单 key 一致），promote 时映射为 vue-router 路径 /<key> */
const routeFromHash = () => location.hash.replace(/^#\/?/, '').split(/[?/]/)[0] || 'orders'
const state = Vue.reactive({
  route: routeFromHash(),
  collapsed: false,
  view: 'ready',        // ready | loading | empty | error（R-018 三态）
  dataset: 'normal',    // normal | long | big
  keyword: '',
  status: '',
  page: 1,
  pageSize: 10,
  dialogOpen: false,
  form: { customer: '', amount: 0, remark: '' },
})

/* ===== ④ methods：只读 DATA、改 state；禁止直接操作 DOM 样式 ===== */
const app = Vue.createApp({
  setup() {
    const rows = Vue.computed(() => (state.view === 'empty' ? [] : DATA.orders[state.dataset]))
    const filteredRows = Vue.computed(() =>
      rows.value.filter(r =>
        (!state.keyword || r.customer.includes(state.keyword) || r.no.includes(state.keyword)) &&
        (!state.status || r.status === state.status)))
    const pagedRows = Vue.computed(() => {
      const start = (state.page - 1) * state.pageSize
      return filteredRows.value.slice(start, start + state.pageSize)
    })
    Vue.watch(() => [state.keyword, state.status, state.dataset], () => { state.page = 1 })

    const statusLabel = v => (DATA.statuses.find(s => s.value === v) || {}).label || v
    const statusType = v => ({ pending: 'warning', done: 'success', cancelled: 'info' })[v] || 'info'
    const onSelect = key => { location.hash = `#/${key}` }
    window.addEventListener('hashchange', () => { state.route = routeFromHash() })
    if (!location.hash) history.replaceState(null, '', `#/${state.route}`)
    const resetFilter = () => { state.keyword = ''; state.status = '' }
    const reload = () => { state.view = 'loading'; setTimeout(() => { state.view = 'ready' }, 600) }
    const view = row => ElementPlus.ElMessage.info(`查看 ${row.no}`)
    const remove = row => ElementPlus.ElMessageBox.confirm(`删除 ${row.no}？`, '确认').then(() => ElementPlus.ElMessage.success('已删除')).catch(() => {})
    const submit = () => { state.dialogOpen = false; ElementPlus.ElMessage.success('已创建（mock）') }

    return { DATA, state, rows, filteredRows, pagedRows, statusLabel, statusType, onSelect, resetFilter, reload, view, remove, submit }
  },
})
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn }).use(DesignSystemUI).mount('#app')
</script>
</body>
</html>
